# NVM OpenRC configuration
export NVM_HOST="${NVM_HOST:-0.0.0.0}"
export NVM_PORT="${NVM_PORT:-8011}"
export NVM_DATA_DIR="${NVM_DATA_DIR:-/var/lib/nvm}"
export NVM_DB_PATH="${NVM_DB_PATH:-/var/lib/nvm/nvm.db}"
export NVM_USER="${NVM_USER:-root}"
# REQUIRED for ESP32 provisioning. Set a strong random value.
export NVM_ADMIN_TOKEN="${NVM_ADMIN_TOKEN:-}"
