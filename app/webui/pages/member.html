<div id="tab-member" class="tab-pane">
  <section class="section">
    <h2>Member / Anggota</h2>
    <p class="hint">Registrasi data nasabah berdasarkan identitas KTP. NFC didaftarkan melalui Cashier pada tahap berikutnya.</p>
    <form id="memberForm" class="grid">
      <label>Admin Token<input id="memberAdminToken" type="password" autocomplete="off" required></label>
      <label>Member ID<input id="memberId" placeholder="otomatis"></label>
      <label>NIK<input id="memberNik" maxlength="16" required></label>
      <label>Nama Lengkap<input id="memberName" required></label>
      <label>Tempat Lahir<input id="memberBirthPlace"></label>
      <label>Tanggal Lahir<input id="memberBirthDate" type="date"></label>
      <label>Jenis Kelamin<select id="memberSex"><option value="">Pilih</option><option>Laki-laki</option><option>Perempuan</option></select></label>
      <label>Alamat<input id="memberAddress"></label>
      <label>RT<input id="memberRt"></label>
      <label>RW<input id="memberRw"></label>
      <label>Desa/Kelurahan<input id="memberVillage"></label>
      <label>Kecamatan<input id="memberDistrict"></label>
      <label>Kabupaten/Kota<input id="memberCity"></label>
      <label>Provinsi<input id="memberProvince"></label>
      <label>Agama<input id="memberReligion"></label>
      <label>Status Perkawinan<input id="memberMarital"></label>
      <label>Pekerjaan<input id="memberOccupation"></label>
      <label>Kewarganegaraan<input id="memberCitizenship" value="WNI"></label>
      <label>No. HP<input id="memberPhone" type="tel"></label>
      <label>Email<input id="memberEmail" type="email"></label>
      <label>Tanggal Registrasi<input id="memberRegistrationDate" type="date"></label>
      <label>Status<select id="memberStatus"><option value="active">active</option><option value="inactive">inactive</option><option value="suspended">suspended</option></select></label>
      <div><button type="submit">Simpan Member</button></div>
    </form>
    <div id="memberAuthResult" class="hint"></div>
    <div id="members" class="scroll"></div>
  </section>
</div>
